# Docker Compose for Local Development
services:
  postgres:
    image: postgres:16-alpine
    container_name: omnisurv_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnisurv
      POSTGRES_PASSWORD: omnisurv_secure_pass
      POSTGRES_DB: omnisurv_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnisurv_redis_dev
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: omnisurv_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage

volumes:
  postgres_dev_data:
  qdrant_dev_data:
